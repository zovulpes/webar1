<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>WebAR Test</title>

    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"
    ></script>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #eee;
      }

      model-viewer {
        width: 100%;
        height: 70vh;
      }

      .quicklook-test {
        display: block;
        width: 180px;
        margin: 20px auto;
        text-align: center;
      }

      .quicklook-test img {
        width: 100%;
        border: 2px solid black;
      }
    </style>
  </head>

  <body>
    <model-viewer
      src="Boot6.glb"
      ios-src="Boot.usdz"
      alt="3D-модель ботинка"
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      auto-rotate
      environment-image="studio_small_03_1k.hdr"
      shadow-intensity="1"
    >
    </model-viewer>

    <a class="quicklook-test" rel="ar" href="Boot.usdz">
      <img
        src="https://dummyimage.com/300x120/ffffff/000000&text=OPEN+AR"
        alt="Открыть в AR"
      />
    </a>
  </body>
</html>
