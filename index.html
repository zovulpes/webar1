<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>WebAR — model-viewer</title>

    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"
    ></script>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #eeeeee;
      }

      model-viewer {
        width: 100vw;
        height: 100vh;
      }

      .ar-button {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        padding: 14px 24px;

        border: none;
        border-radius: 10px;

        font-size: 16px;
        cursor: pointer;

        background: white;
        color: black;
      }
    </style>
  </head>

  <body>
    <model-viewer
      src="Boot6.glb"
      ios-src="Boot.usdz"
      alt="3D-модель астронавта"
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      auto-rotate
      environment-image="studio_small_03_1k.hdr"
      shadow-intensity="1"
    >
      <button
        class="ar-button"
        slot="ar-button"
        style="position: fixed; z-index: 99999; bottom: 20px; left: 20px"
      >
        Открыть в AR
      </button>
    </model-viewer>

    <a rel="ar" href="Boot.usdz"> Открыть USDZ в AR </a>
  </body>
</html>
